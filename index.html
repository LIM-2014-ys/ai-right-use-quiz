<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 올바르게 이용하기 퀴즈</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 폭죽 이펙트용 캔버스 -->
  <canvas id="fireworks-canvas"></canvas>

  <div class="app-container">
    <header class="app-header">
      <div class="badge">AI 윤리 및 올바른 사용법</div>
      <h1>AI 올바르게 이용하기 퀴즈</h1>
    </header>

    <main class="app-content">
      <!-- 1. 시작 화면 -->
      <section id="screen-start" class="screen active">
        <div class="start-card">
          <div class="start-hero-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a10 10 0 1 0 10 10H12V2z"></path>
              <path d="M12 12L2.5 7.5"></path>
              <path d="m12 12 8.5 4.5"></path>
              <path d="m12 12-4.5 8.5"></path>
            </svg>
          </div>
          <h2>올바른 AI 사용 가이드</h2>
          <p class="description">
            10개의 AI 윤리 및 사용 수칙 중 <strong>5문항</strong>이 무작위로 출제됩니다.
          </p>
          <div class="info-list">
            <div class="info-item">
              <span class="info-bullet"></span>
              <span>문항 수: 총 5문제</span>
            </div>
            <div class="info-item">
              <span class="info-bullet"></span>
              <span>기회: 1회 참여 가능</span>
            </div>
          </div>
        </div>
        <button id="btn-start" class="btn btn-primary bottom-btn">퀴즈 시작하기</button>
      </section>

      <!-- 2. 이미 참여함 화면 -->
      <section id="screen-already" class="screen">
        <div class="card">
          <h2>참여 완료</h2>
          <p class="description">
            이미 퀴즈 응시를 완료하셨습니다.<br>
            중복 참여는 불가능합니다.
          </p>
        </div>
      </section>

      <!-- 3. 퀴즈 진행 화면 -->
      <section id="screen-quiz" class="screen">
        <div class="quiz-progress-bar">
          <div id="progress-fill" class="progress-fill" style="width: 0%;"></div>
        </div>
        <div class="quiz-meta">
          <span id="quiz-step" class="step-text">문제 1 / 5</span>
        </div>

        <div class="card quiz-card">
          <h3 id="question-text" class="question-title"></h3>
          <div id="options-container" class="options-list"></div>
        </div>

        <button id="btn-next" class="btn btn-primary bottom-btn" disabled>다음 문제</button>
      </section>

      <!-- 4. 결과 화면 -->
      <section id="screen-result" class="screen">
        <div class="card">
          <h2>퀴즈 결과</h2>
          <div class="score-box">
            <span class="score-label">최종 점수</span>
            <span id="score-text" class="score-value">0 / 5</span>
          </div>
          <p id="result-desc" class="description"></p>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <p>© 2026. 윤슬초 전교회장 임준서. All rights reserved.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
