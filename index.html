<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 올바르게 이용하기 퀴즈</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 폭죽 이펙트용 캔버스 -->
  <canvas id="fireworks-canvas"></canvas>

  <div class="app-container">
    <header class="app-header">
      <div class="badge">AI 윤리 및 올바른 사용법</div>
      <h1>AI 올바르게 이용하기 퀴즈</h1>
    </header>

    <main class="app-content">
      <!-- 1. 시작 화면 -->
      <section id="screen-start" class="screen active">
        <div class="card">
          <h2>AI 올바른 사용법 퀴즈</h2>
          <p class="description">
            10개의 문제 중 5개의 문제가 무작위로 출제됩니다.
          </p>
        </div>
        <button id="btn-start" class="btn btn-primary bottom-btn">퀴즈 시작하기</button>
      </section>

      <!-- 2. 이미 참여함 화면 -->
      <section id="screen-already" class="screen">
        <div class="card">
          <h2>참여 완료</h2>
          <p class="description">
            이미 퀴즈 응시를 완료하셨습니다.<br>
            중복 참여는 불가능합니다.
          </p>
        </div>
      </section>

      <!-- 3. 퀴즈 진행 화면 -->
      <section id="screen-quiz" class="screen">
        <div class="quiz-progress-bar">
          <div id="progress-fill" class="progress-fill" style="width: 0%;"></div>
        </div>
        <div class="quiz-meta">
          <span id="quiz-step" class="step-text">문제 1 / 5</span>
        </div>

        <div class="card quiz-card">
          <h3 id="question-text" class="question-title"></h3>
          <div id="options-container" class="options-list"></div>
        </div>

        <button id="btn-next" class="btn btn-primary bottom-btn" disabled>다음 문제</button>
      </section>

      <!-- 4. 결과 화면 -->
      <section id="screen-result" class="screen">
        <div class="card">
          <h2>퀴즈 결과</h2>
          <div class="score-box">
            <span class="score-label">최종 점수</span>
            <span id="score-text" class="score-value">0 / 5</span>
          </div>
          <p id="result-desc" class="description"></p>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <p>© 윤슬초 전교회장 임준서</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
